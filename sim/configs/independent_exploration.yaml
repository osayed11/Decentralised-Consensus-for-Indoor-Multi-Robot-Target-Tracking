# Phases 1-2: robust random waypoint patrol plus private sensor-footprint history.
# Coverage history is diagnostic only; goal scoring by coverage is Phase 3+.
name: independent_exploration
strategy: independent
n_robots: 3
n_targets: 1
patrol: true
independent_tracking: true  # follow own Kalman estimate when target seen
tracking_stop_radius: 0.8
tracking_replan_distance: 0.5
tracking_replan_interval: 1.0
reacquire_timeout: 20.0
robot_avoidance: true
robot_detection_range: 2.0
robot_safety_margin: 0.05
patrol_min_goal_distance: 1.0
patrol_max_goal_attempts: 20
patrol_stall_timeout: 8.0
patrol_progress_distance: 0.15
exploration_observe_interval: 0.5
use_line_of_sight: true
query_interval: null  # avoid unrelated ground-truth dispatch placeholder in exploration demo
relocation_dist: uniform
relocation_min: 30.0
relocation_max: 90.0
dt: 0.1
time_limit: 120.0
n_trials: 3
seed: 0
output_dir: results
